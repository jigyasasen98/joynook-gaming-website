<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7856E8" />
      <stop offset="50%" stop-color="#987AEE" />
      <stop offset="100%" stop-color="#FF7777" />
    </linearGradient>
    <linearGradient id="controllerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F4F1FD" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#361D88" flood-opacity="0.35" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background App Icon Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Subtle inner shine border -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="4" />

  <!-- Ambient light bubble in background -->
  <circle cx="160" cy="140" r="140" fill="rgba(255,255,255,0.12)" />
  <circle cx="380" cy="380" r="100" fill="rgba(0,0,0,0.08)" />

  <!-- Joy Gamepad Silhouette -->
  <g filter="url(#shadow)">
    <!-- Main Controller Body -->
    <path d="M160 170 C90 170 60 230 60 300 C60 370 100 410 145 410 C180 410 205 375 230 345 C242 330 270 330 282 345 C307 375 332 410 367 410 C412 410 452 370 452 300 C452 230 422 170 352 170 Z" 
          fill="url(#controllerGrad)" />

    <!-- D-Pad Left -->
    <g fill="#7856E8">
      <rect x="142" y="240" width="28" height="76" rx="8" />
      <rect x="118" y="264" width="76" height="28" rx="8" />
      <circle cx="156" cy="278" r="6" fill="#FFFFFF" opacity="0.8" />
    </g>

    <!-- Action Buttons Right -->
    <g>
      <!-- Top Button (Coral) -->
      <circle cx="356" cy="242" r="15" fill="#FF7777" />
      <!-- Right Button (Yellow) -->
      <circle cx="392" cy="278" r="15" fill="#FFD66B" />
      <!-- Bottom Button (Mint) -->
      <circle cx="356" cy="314" r="15" fill="#4ECCA3" />
      <!-- Left Button (Sky) -->
      <circle cx="320" cy="278" r="15" fill="#5BC0EB" />
    </g>

    <!-- Center Menu / Joy Buttons -->
    <ellipse cx="230" cy="256" rx="12" ry="7" fill="#D6C9F8" />
    <ellipse cx="282" cy="256" rx="12" ry="7" fill="#D6C9F8" />
    <circle cx="256" cy="290" r="10" fill="#B8A3F3" />
  </g>

  <!-- Sparkles / Stars -->
  <g fill="#FFD66B" filter="url(#glow)">
    <!-- Top-Right Sparkle -->
    <path d="M410 100 Q425 100 425 85 Q425 100 440 100 Q425 100 425 115 Q425 100 410 100 Z" />
    <!-- Small Sparkle -->
    <path d="M80 140 Q90 140 90 130 Q90 140 100 140 Q90 140 90 150 Q90 140 80 140 Z" />
    <!-- Bottom Sparkle -->
    <path d="M430 380 Q440 380 440 370 Q440 380 450 380 Q440 380 440 390 Q440 380 430 380 Z" />
  </g>
</svg>
